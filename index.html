<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated To-Do List</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header>
      <h1>Animated To-Do List</h1>
      <p>Keep your tasks moving with smooth entry and completion animations.</p>
    </header>

    <section class="task-creator">
      <input id="taskInput" type="text" placeholder="Enter a new task" />
      <button id="addTaskBtn">Add Task</button>
    </section>

    <ul id="taskList" class="task-list" aria-live="polite"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
